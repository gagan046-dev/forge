{{- /*
forge-web: the React console, served by nginx-unprivileged (uid 101) on port 8080.
It only serves static files; the ingress routes /v1 and /api straight to the gateway.
*/ -}}
{{- $sel := include "forge.selectorLabels" (dict "root" . "component" "web") }}
apiVersion: v1
kind: Service
metadata:
  name: forge-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forge.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "forge.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "forge.podSecurity" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "forge.image" .Values.web.image }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            {{- include "forge.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}         # nginx pid file and temp buffers
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
