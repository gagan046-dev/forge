# ci.yaml - test, build and deliver Forge.
#
#   pull request / push to main
#     gateway      ruff (lint + format) + pytest against real Postgres (pgvector) and Redis
#     web          typecheck + vitest + production build
#     helm         helm lint + helm template + kubeconform for both charts, every value file
#     gpu-exporter unit tests (stdlib unittest)
#   push to main only (after all four pass)
#     build-push   forge-gateway, forge-web, forge-gpu-exporter -> ghcr.io, tag sha-<7 hex>
#     bump-dev     write that tag into charts/forge/values-dev-images.yaml and
#                  charts/forge-inference/values-images.yaml, commit "[skip ci]";
#                  Argo CD sees the commit and deploys forge-dev + forge-inference.
#
# Prod is never touched here: promotion is a reviewed pull request (promote.yaml).
#
# Security: every action is pinned to a full commit SHA (a tag can be moved, a SHA
# cannot); the default token is read-only and each job asks only for what it needs.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are useless; a main run may be mid-push, so let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  UV_VERSION: 0.12.24

jobs:
  gateway:
    name: gateway lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-test         # throwaway CI database, not a secret
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.6.6-alpine           # same Redis as charts/forge-inference
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The core tests and the RAG tests each get their own database so their
      # create/drop of tables cannot interfere. The unit tests run the scheduler's Lua
      # scripts on fakeredis; the Redis service is there for ad-hoc checks against the
      # same Redis version the cluster runs.
      FORGE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge-test@127.0.0.1:5432/forge_test
      FORGE_TEST_RAG_DATABASE_URL: postgresql+asyncpg://forge:forge-test@127.0.0.1:5432/forge_rag_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Create the RAG test database
        env:
          PGPASSWORD: forge-test
        run: psql -h 127.0.0.1 -U forge -d forge_test -c "CREATE DATABASE forge_rag_test"
      - run: uv run pytest -q

  web:
    name: web typecheck + test + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    name: helm lint + template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform (checksum verified)
        run: |
          base=https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        run: |
          # gitops/models.yaml is the single source of truth for models; Argo CD passes it
          # to both charts as an extra value file, so CI renders with it too.
          helm lint charts/forge-inference --strict \
            -f charts/forge-inference/values-images.yaml -f gitops/models.yaml
          for env in dev prod; do
            helm lint charts/forge --strict \
              -f charts/forge/values-$env.yaml -f charts/forge/values-$env-images.yaml \
              -f gitops/models.yaml
          done
      - name: helm template + kubeconform
        run: |
          mkdir -p rendered
          helm template forge-inference charts/forge-inference -n forge-inference \
            -f charts/forge-inference/values-images.yaml -f gitops/models.yaml \
            > rendered/forge-inference.yaml
          for env in dev prod; do
            helm template forge charts/forge -n forge-$env \
              -f charts/forge/values-$env.yaml -f charts/forge/values-$env-images.yaml \
              -f gitops/models.yaml > rendered/forge-$env.yaml
          done
          # -ignore-missing-schemas: CRDs (KEDA ScaledObject, ...) have no built-in schema.
          kubeconform -strict -summary -ignore-missing-schemas rendered/*.yaml
      - name: Validate the Argo CD manifests are well-formed YAML
        run: |
          for f in gitops/models.yaml gitops/bootstrap/*.yaml gitops/apps/*.yaml gitops/envs/*/*.yaml; do
            [ -e "$f" ] || continue
            python3 -c "import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
          done

  gpu-exporter:
    name: gpu-exporter unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: gpu-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Standard library only: the runner's Python 3.12 is all it needs.
      - run: python3 -m unittest discover -s tests -v

  build-push:
    name: build + push ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gateway, web, helm, gpu-exporter]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                 # push to ghcr.io
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: forge-gateway
            context: gateway
          - image: forge-web
            context: web
          - image: forge-gpu-exporter
            context: gpu-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # one immutable tag per commit: sha-<7 hex>
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

  bump-dev:
    name: bump dev image tags
    needs: [build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write                 # the ONLY job allowed to push to the repo
    concurrency:
      group: bump-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Work out the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Are the images publicly pullable?
        id: public
        # The cluster pulls WITHOUT credentials. New ghcr.io packages start out private;
        # until they are made public, keep dev on the images it already runs.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          ok=true
          for img in forge-gateway forge-web forge-gpu-exporter; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:$owner/$img:pull" | jq -r '.token // empty' || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$owner/$img/manifests/$TAG")
            echo "$img:$TAG anonymous pull -> HTTP $code"
            [ "$code" = 200 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            echo "::warning::ghcr.io packages are not public yet - dev keeps its current images. Make forge-gateway, forge-web and forge-gpu-exporter public (package settings) and push again."
          fi
      - name: Write the new tag and push
        if: steps.public.outputs.ok == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          files=(charts/forge/values-dev-images.yaml charts/forge-inference/values-images.yaml)
          bash .github/scripts/write-image-values.sh forge "${files[0]}" "$TAG" dev
          bash .github/scripts/write-image-values.sh forge-inference "${files[1]}" "$TAG" "forge-inference (shared by dev and prod)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          # "[skip ci]" + pushes made with GITHUB_TOKEN never start a new workflow run -> no loop.
          git commit -m "chore(dev): deploy images $TAG [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
