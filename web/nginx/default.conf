# Serves the Forge SPA. /v1 and /api are routed to the gateway by the ingress,
# so this server only ever sees UI paths.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # If the ingress ever sends API traffic here, fail loudly instead of
    # answering 200 with index.html (which the client would fail to parse).
    location ~ ^/(api|v1|internal|metrics)(/|$) {
        default_type application/json;
        return 404 '{"error":{"message":"API path reached the web server; check the ingress routes","type":"not_found"}}';
    }

    # Vite puts a content hash in every asset filename, so they never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve index.html, never cached,
    # so a new deployment is picked up on the next page load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
