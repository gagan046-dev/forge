# sealed-secrets.yaml - the Sealed Secrets controller (chart 2.20.0, controller v0.40.0).
#
# Why: Forge's Secrets (admin password, session key, database and Redis passwords) must
# live in git like everything else, but the repo is PUBLIC. kubeseal encrypts a Secret
# with this controller's public key; only the controller (private key in kube-system)
# can decrypt it, so the SealedSecret files in gitops/envs/ are safe to commit.
#
# Chart source: the chart's Helm repository (bitnami-labs.github.io/sealed-secrets)
# answers 404, so the chart is taken from the project's git repository at the release
# tag helm-v2.20.0 (same chart, same version).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # CRD + controller before any SealedSecret
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: helm-v2.20.0
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for "sealed-secrets-controller" in kube-system by default,
        # so scripts/seal-secrets.ps1 needs no extra flags.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
