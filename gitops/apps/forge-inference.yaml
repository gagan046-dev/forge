# forge-inference.yaml - the shared GPU tier -> namespace forge-inference.
#
# Three sources from this repo, combined into one Application:
#   1. charts/forge-inference, with values-images.yaml (CI) and $values/gitops/models.yaml
#   2. ref "values": the repo itself, only so source 1 can read gitops/models.yaml
#   3. gitops/envs/inference: the Namespace (Pod Security labels) and the SealedSecret
#      forge-redis.sealed.yaml (generated by scripts/seal-secrets.ps1)
# A PR that changes gitops/models.yaml changes the pull Job's name and the Ollama pod's
# checksum annotation: Argo CD downloads the new models first, then restarts Ollama.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-inference
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/gagan046-dev/forge.git
      targetRevision: main
      path: charts/forge-inference
      helm:
        releaseName: forge-inference
        valueFiles:
          - values-images.yaml          # gpu-exporter image tag, rewritten by CI
          - $values/gitops/models.yaml  # the single source of truth for models
    - repoURL: https://github.com/gagan046-dev/forge.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gagan046-dev/forge.git
      targetRevision: main
      path: gitops/envs/inference
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-inference
  # KEDA owns the Ollama replica count (0 or 1). The chart leaves replicas out, and this
  # makes sure Argo CD never "corrects" KEDA's choice (which would wake the GPU up).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ollama
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
